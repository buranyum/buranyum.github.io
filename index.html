<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BURANYUM // DESIGN LAB</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --accent: #00FF41; /* Buranyum Işıltısı */
            --text: #F2F2F2;
            --dim: #555;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* --- GRAIN OVERLAY (Doku Katmanı) --- */
        body::before {
            content: "";
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            opacity: 0.04; pointer-events: none; z-index: 50;
        }

        /* --- AMBIENT BACKGROUND (Atmosfer) --- */
        .glow {
            position: absolute; width: 40vw; height: 40vw;
            background: radial-gradient(circle, rgba(0, 255, 65, 0.08) 0%, transparent 70%);
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            filter: blur(60px); z-index: 1;
        }

        /* --- MAIN INTERFACE (Ana Arayüz) --- */
        .container {
            position: relative; z-index: 10;
            max-width: 800px; padding: 0 40px;
            text-align: left;
        }

        .label {
            font-size: 10px; letter-spacing: 5px; color: var(--accent);
            margin-bottom: 20px; display: block;
            animation: flicker 2s infinite;
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(5rem, 15vw, 10rem);
            line-height: 0.8; margin-bottom: 30px;
            letter-spacing: -2px;
            background: linear-gradient(180deg, #fff 30%, #444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .description {
            font-size: 1.2rem; line-height: 1.6;
            color: #AAA; max-width: 550px;
            margin-bottom: 50px; font-weight: 300;
        }

        /* --- BUTTONS (Eylem Alanı) --- */
        .actions {
            display: flex; gap: 20px; align-items: center;
        }

        .btn {
            padding: 18px 35px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700; font-size: 14px;
            text-transform: uppercase; letter-spacing: 2px;
            text-decoration: none; position: relative;
            transition: 0.4s cubic-bezier(0.2, 1, 0.3, 1);
            overflow: hidden;
        }

        /* Projects Button - Solid Metal */
        .btn-projects {
            background-color: var(--accent);
            color: #000;
        }

        /* Contact Button - Outline */
        .btn-contact {
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text);
        }

        .btn:hover {
            transform: translateY(-5px) skewX(-5deg);
            box-shadow: 0 15px 30px rgba(0, 255, 65, 0.2);
        }

        .btn-contact:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* --- DECORATIVE ELEMENTS --- */
        .coordinates {
            position: absolute; bottom: 40px; left: 40px;
            font-size: 10px; color: var(--dim); letter-spacing: 2px;
        }

        @keyframes flicker {
            0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; }
        }

        @media (max-width: 600px) {
            .actions { flex-direction: column; align-items: flex-start; }
            h1 { font-size: 5rem; }
        }
    </style>
</head>
<body>

    <div class="glow"></div>
    <div class="coordinates">SEC_LVL: 04 // 40.7663° N, 29.7891° E</div>

    <div class="container">
        <span class="label">STATUS: OPERATIONAL</span>
        <h1>BURANYUM<br>DESIGN LAB</h1>
        
        <p class="description">
            Buranyum Design Lab is the new-era of design for game industry. 
            We are here to create unique and memorable experiences for every project. 
            See our projects or contact with us.
        </p>

        <div class="actions">
            <a href="https://assetstore.unity.com/publishers/130602" target="_blank" class="btn btn-projects">
                See Projects
            </a>
            <a href="mailto:buranyumlab@gmail.com" class="btn btn-contact">
                Contact
            </a>
        </div>
    </div>

    <script>
        // Mouse hareketiyle arka plan ışığını hareket ettir
        const glow = document.querySelector('.glow');
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;
            glow.style.left = x + 'px';
            glow.style.top = y + 'px';
        });
    </script>
</body>
</html>
